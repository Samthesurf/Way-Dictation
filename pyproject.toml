[project]
name = "groq-dictation"
version = "0.1.0"
description = "Native Linux dictation app using Groq's free Whisper speech-to-text. Types into any focused app."
requires-python = ">=3.11"
dependencies = [
    "groq>=0.9.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyside6>=6.7",
    "websockets>=12.0",
]

[project.scripts]
groq-dictate = "groq_dictation.cli:main"
groq-dictation-gui = "groq_dictation.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groq_dictation"]