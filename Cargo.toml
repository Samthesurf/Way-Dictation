[package]
name = "way-dictation"
version = "0.2.0"
edition = "2021"
description = "Native Linux speech-to-text dictation that types into any focused app (Groq / OpenRouter)"
license = "MIT"
default-run = "way-dictate"

[[bin]]
name = "way-dictate"
path = "src/main.rs"

[[bin]]
name = "way-dictation-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:iced", "dep:iced_winit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
ctrlc = "3"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI (build with: cargo build --features gui --bin way-dictation-gui)
iced = { version = "0.14", optional = true, features = ["canvas"] }
iced_winit = { version = "0.14", optional = true }

# --- Debian/Ubuntu package (cargo deb) ---
[package.metadata.deb]
maintainer = "Samuel Ukpai <Samthesurf@users.noreply.github.com>"
section = "utils"
priority = "optional"
features = ["gui"]
# winit/wgpu dlopen the Wayland/X11/Vulkan/fontconfig libraries, so ldd-based
# auto-detection only sees libasound; list the rest explicitly.
depends = "libasound2, libwayland-client0, libxkbcommon0, libx11-6, libegl1, libgl1, libvulkan1, libfontconfig1"
assets = [
    ["target/release/way-dictate", "usr/bin/", "755"],
    ["target/release/way-dictation-gui", "usr/bin/", "755"],
    ["packaging/way-dictate-hotkey.sh", "usr/bin/", "755"],
    ["packaging/way-dictation.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/way-dictation-128.png", "usr/share/icons/hicolor/128x128/apps/way-dictation.png", "644"],
    ["packaging/icons/way-dictation-256.png", "usr/share/icons/hicolor/256x256/apps/way-dictation.png", "644"],
    ["packaging/icons/way-dictation-512.png", "usr/share/icons/hicolor/512x512/apps/way-dictation.png", "644"],
]

# --- Fedora/RHEL package (cargo generate-rpm) ---
[package.metadata.generate-rpm]
license = "MIT"
summary = "Native Linux speech-to-text dictation (Groq / OpenRouter)"
description = "Speak into the mic, transcribe with Groq or OpenRouter, and type into any focused app. Ships a floating GUI widget and a CLI (way-dictate)."
features = ["gui"]
requires = ["alsa-lib", "libwayland-client", "libxkbcommon", "libX11", "libglvnd-egl", "libglvnd-glx", "vulkan-loader", "fontconfig"]
assets = [
    { source = "target/release/way-dictate", dest = "/usr/bin/way-dictate", mode = "755" },
    { source = "target/release/way-dictation-gui", dest = "/usr/bin/way-dictation-gui", mode = "755" },
    { source = "packaging/way-dictate-hotkey.sh", dest = "/usr/bin/way-dictate-hotkey", mode = "755" },
    { source = "packaging/way-dictation.desktop", dest = "/usr/share/applications/way-dictation.desktop", mode = "644" },
    { source = "packaging/icons/way-dictation-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/way-dictation.png", mode = "644" },
    { source = "packaging/icons/way-dictation-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/way-dictation.png", mode = "644" },
    { source = "packaging/icons/way-dictation-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/way-dictation.png", mode = "644" },
]
