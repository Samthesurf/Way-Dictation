[package]
name = "way-dictation"
version = "0.2.0"
edition = "2021"
description = "Native Linux speech-to-text dictation that types into any focused app (Groq / OpenRouter)"
license = "MIT"
default-run = "way-dictate"

[[bin]]
name = "way-dictate"
path = "src/main.rs"

[[bin]]
name = "way-dictation-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:iced", "dep:iced_winit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
ctrlc = "3"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI (build with: cargo build --features gui --bin way-dictation-gui)
iced = { version = "0.14", optional = true, features = ["canvas"] }
iced_winit = { version = "0.14", optional = true }
